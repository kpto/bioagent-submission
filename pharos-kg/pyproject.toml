[project]
name = "pharos-kg"
version = "0.1.0"
description = "A kg-build-system knowledge graph over the Pharos kinase family."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chdb>=4.4; sys_platform != 'win32'",
    "duckdb>=2.0",
    "kg-build-system",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.400",
]

[tool.uv.sources]
kg-build-system = { path = "../kg-build-system", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharos_kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
include = ["pharos_kg"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
